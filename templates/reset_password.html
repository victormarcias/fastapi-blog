{% extends "layout.html" %}
{% block content %}
<div class="content-section py-3 px-4 mb-4">
    <h2 class="mb-4">Reset Password</h2>
    <p class="text-body-secondary mb-4">Enter your new password below.</p>
    <form id="resetPasswordForm">
        <div class="mb-3">
            <label for="newPassword" class="form-label">New Password</label>
            <input type="password" class="form-control" id="newPassword" name="new_password" required minlength="8"
                autofocus>
            <div class="form-text">Password must be at least 8 characters.</div>
        </div>
        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm New Password</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirm_password" required
                minlength="8">
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Reset Password</button>
    </form>
    <p class="mt-3">
        Remember your password? <a href="{{ url_for('login_page') }}">Login here</a>
    </p>
</div>
{% endblock content %}

{% block scripts %}
<script type="module">
    import { getErrorMessage, showModal } from '{{ base_path }}/static/js/utils.js';

    const resetPasswordForm = document.getElementById('resetPasswordForm');
    const submitBtn = document.getElementById('submitBtn');
    const token = new URLSearchParams(window.location.search).get('token');

    resetPasswordForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
            document.getElementById('errorMessage').textContent = 'Passwords do not match.';
            showModal('errorModal');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Resetting...';

        try {
            const response = await fetch('{{ base_path }}/api/users/reset-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token, new_password: newPassword }),
            });

            if (response.ok) {
                document.getElementById('successMessage').textContent =
                    'Your password has been reset successfully. You can now log in.';
                showModal('successModal');

                resetPasswordForm.reset();

                document
                    .getElementById('successModal')
                    .addEventListener(
                        'hidden.bs.modal',
                        () => {
                            window.location.href = '{{ url_for("login_page") }}';
                        },
                        { once: true },
                    );
            } else {
                const error = await response.json();
                document.getElementById('errorMessage').textContent = getErrorMessage(error);
                showModal('errorModal');
            }
        } catch (error) {
            document.getElementById('errorMessage').textContent =
                'Network error. Please check your connection and try again.';
            showModal('errorModal');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Reset Password';
        }
    });
</script>
{% endblock scripts %}
